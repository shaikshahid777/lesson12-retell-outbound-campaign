<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="t d"><title id="t">Outbound campaign architecture</title><desc id="d">Eligibility checks, Retell call, opt-out handler, signed webhook, and Supabase logging.</desc><defs><style>.node{fill:#101a32;stroke:#6476a8;stroke-width:2}.txt{font:600 16px Arial,sans-serif;fill:#f8fafc}.sub{font:13px Arial,sans-serif;fill:#cbd5e1}.edge{stroke:#67e8f9;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.guard{stroke:#fbbf24}.store{stroke:#a78bfa}</style></defs><rect width="1000" height="430" rx="18" fill="#080d1c"/>
<rect class="node" x="25" y="40" width="190" height="78" rx="12"/><text class="txt" x="120" y="70" text-anchor="middle">Campaign Dispatcher</text><text class="sub" x="120" y="94" text-anchor="middle">n8n + lead query</text>
<rect class="node" x="270" y="40" width="200" height="78" rx="12" stroke="#fbbf24"/><text class="txt" x="370" y="70" text-anchor="middle">Eligibility Guard</text><text class="sub" x="370" y="94" text-anchor="middle">DNC · timezone · data</text>
<rect class="node" x="530" y="40" width="190" height="78" rx="12"/><text class="txt" x="625" y="70" text-anchor="middle">Retell API</text><text class="sub" x="625" y="94" text-anchor="middle">dynamic variables</text>
<rect class="node" x="780" y="40" width="190" height="78" rx="12"/><text class="txt" x="875" y="70" text-anchor="middle">Outbound Call</text><text class="sub" x="875" y="94" text-anchor="middle">authorized test lead</text>
<path class="edge" d="M215 79H270M470 79H530M720 79H780"/>
<rect class="node" x="65" y="245" width="220" height="85" rx="12" stroke="#fbbf24"/><text class="txt" x="175" y="276" text-anchor="middle">Opt-out Handler</text><text class="sub" x="175" y="300" text-anchor="middle">register DNC · suppress</text>
<rect class="node" x="390" y="245" width="220" height="85" rx="12"/><text class="txt" x="500" y="276" text-anchor="middle">Signed Webhook</text><text class="sub" x="500" y="300" text-anchor="middle">verify signature first</text>
<rect class="node" x="715" y="245" width="220" height="85" rx="12" stroke="#a78bfa"/><text class="txt" x="825" y="276" text-anchor="middle">Supabase Logs</text><text class="sub" x="825" y="300" text-anchor="middle">campaign_call_logs</text>
<path class="edge guard" d="M370 118V185H175V245"/><path class="edge" d="M875 118V185H500V245"/><path class="edge store" d="M610 287H715"/>
<text x="500" y="390" text-anchor="middle" font="14px Arial" fill="#94a3b8">Reject invalid signatures before inserting logs • Keep secrets in credentials</text></svg>