<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Outbound Calling, Compliance-Aware Campaigns banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="0.55" stop-color="#1c2b73"/><stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.55"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <style>
      .bar{transform-box:fill-box;transform-origin:center;animation:wave 1.4s ease-in-out infinite}
      @keyframes wave{0%,100%{transform:scaleY(0.25)}50%{transform:scaleY(1)}}
      .ring{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite;fill:none;stroke:#22d3ee;stroke-width:3}
      @keyframes ring{0%{transform:scale(0.55);opacity:0.9}100%{transform:scale(1.6);opacity:0}}
      .title{font:800 46px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#fff;animation:rise 1.2s ease-out both}
      .sub{font:500 20px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#c7d2fe;animation:rise 1.2s ease-out 0.35s both}
      .tags{font:600 15px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#67e8f9;letter-spacing:1.5px;animation:rise 1.2s ease-out 0.7s both}
      @keyframes rise{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
      .float{animation:float 5s ease-in-out infinite}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    </style>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <circle cx="150" cy="150" r="120" fill="url(#glow)"/>
  <g class="float">
    <circle class="ring" cx="150" cy="150" r="60"/>
    <circle class="ring" cx="150" cy="150" r="60" style="animation-delay:0.8s"/>
    <circle class="ring" cx="150" cy="150" r="60" style="animation-delay:1.6s"/>
    <circle cx="150" cy="150" r="52" fill="#0f172a" stroke="#22d3ee" stroke-width="3"/>
    <path d="M132 124c-4 0-8 4-7 9 4 24 20 40 44 44 5 1 9-3 9-7v-10c0-3-2-5-5-6l-10-2c-3-1-5 0-7 2l-3 3c-8-4-14-10-18-18l3-3c2-2 3-4 2-7l-2-10c-1-3-3-5-6-5z" fill="#22d3ee"/>
  </g>
  <g transform="translate(1000,0) scale(0.55,1) translate(-860,0)">
    <rect class="bar" x="860" y="95" width="10" height="110" rx="5" fill="url(#bar)" style="animation-delay:0s"/>
    <rect class="bar" x="882" y="95" width="10" height="110" rx="5" fill="url(#bar)" style="animation-delay:0.15s"/>
    <rect class="bar" x="904" y="95" width="10" height="110" rx="5" fill="url(#bar)" style="animation-delay:0.3s"/>
    <rect class="bar" x="926" y="95" width="10" height="110" rx="5" fill="url(#bar)" style="animation-delay:0.45s"/>
    <rect class="bar" x="948" y="95" width="10" height="110" rx="5" fill="url(#bar)" style="animation-delay:0.6s"/>
    <rect class="bar" x="970" y="95" width="10" height="110" rx="5" fill="url(#bar)" style="animation-delay:0.75s"/>
    <rect class="bar" x="992" y="95" width="10" height="110" rx="5" fill="url(#bar)" style="animation-delay:0.9s"/>
    <rect class="bar" x="1014" y="95" width="10" height="110" rx="5" fill="url(#bar)" style="animation-delay:1.05s"/>
    <rect class="bar" x="1036" y="95" width="10" height="110" rx="5" fill="url(#bar)" style="animation-delay:1.2s"/>
    <rect class="bar" x="1058" y="95" width="10" height="110" rx="5" fill="url(#bar)" style="animation-delay:0.35s"/>
  </g>
  <text class="title" x="260" y="125">Outbound Calling Campaigns</text>
  <text class="sub" x="262" y="165">Compliance-aware dialing with Retell AI, n8n and Supabase</text>
  <text class="tags" x="262" y="205">TIMEZONE GUARD   |   DNC OPT-OUT   |   WEBHOOK LOGGING   |   5 CALLS PER SECOND</text>
  <path d="M0 262 H1200" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
  <circle r="5" fill="#22d3ee">
    <animateMotion dur="6s" repeatCount="indefinite" path="M0 262 H1200"/>
  </circle>
  <circle r="5" fill="#a78bfa">
    <animateMotion dur="6s" begin="3s" repeatCount="indefinite" path="M0 262 H1200"/>
  </circle>
</svg>
